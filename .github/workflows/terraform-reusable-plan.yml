name: Reusable Terraform PR Plan

on:
  workflow_call:
    inputs:
      terraform_directory:
        description: "Directory containing Terraform configuration"
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Reusable Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PR_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Terraform Format Check
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform fmt -check -recursive

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform plan -input=false -no-color -lock=false -refresh=false
