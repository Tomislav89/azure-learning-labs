name: Terraform CI

on:
  pull_request:
    paths:
      - 'terraform-advanced/**'
      - '.github/workflows/terraform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Validation (${{ matrix.directory }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform-advanced/environments/dev-separated/networking
          - terraform-advanced/environments/dev-separated/compute
          - terraform-advanced/environments/test
          - terraform-advanced/environments/lifecycle-lab
          - terraform-advanced/environments/workspaces-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive .

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
